# Wiederverwendbarer Ablauf: Mails eines Kontos abholen und im aufrufenden
# Daten-Repo ablegen. Zugangsdaten kommen als Secrets vom aufrufenden Workflow.
name: Mail-Abruf

on:
  workflow_call:
    inputs:
      konto:
        description: Name der Quelle, z. B. gmx oder gmail
        required: true
        type: string
      host:
        description: IMAP-Server
        required: true
        type: string
      postfach:
        type: string
        default: INBOX
      code:
        description: pip-Quelle des Second-Brain-Codes
        type: string
        default: git+https://github.com/HaraldKiessling/second-brain@main
    secrets:
      MAIL_USER:
        required: true
      MAIL_PASSWORD:
        required: true
      OPENROUTER_API_KEY:
        description: nur noetig, wenn ki.aktiv in config/einordnen.yaml
        required: false
      DRIVE_TOKEN:
        description: rclone-Token des Agentenkontos; ohne ihn bleiben Anhaenge nur Artefakt
        required: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MIT_DRIVE: ${{ secrets.DRIVE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "${{ inputs.code }}"
      - name: Abrufen
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          second-brain mail-abruf . --konto "${{ inputs.konto }}" --host "${{ inputs.host }}" \
            --postfach "${{ inputs.postfach }}" --anhaenge "$RUNNER_TEMP/anhaenge"
      - name: Anhaenge nach Google Drive
        id: drive
        if: env.MIT_DRIVE == 'true'
        # Ein Drive-Fehler soll das Speichern der Mails nicht verhindern;
        # der Lauf wird am Ende trotzdem rot.
        continue-on-error: true
        env:
          RCLONE_CONFIG_DRIVE_TYPE: drive
          RCLONE_CONFIG_DRIVE_SCOPE: drive
          RCLONE_CONFIG_DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/rclone.zip" https://github.com/rclone/rclone/releases/download/v1.68.2/rclone-v1.68.2-linux-amd64.zip
          unzip -q -j "$RUNNER_TEMP/rclone.zip" '*/rclone' -d "$RUNNER_TEMP/bin"
          PATH="$RUNNER_TEMP/bin:$PATH" second-brain drive . --anhaenge "$RUNNER_TEMP/anhaenge"
      - run: second-brain regelvorschlaege .
      - run: second-brain pruefen .
      - name: Speichern
        run: |
          git config user.name "second-brain"
          git config user.email "second-brain@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "mail: Abruf ${{ inputs.konto }} ($(date -u +%F))"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: anhaenge-${{ inputs.konto }}
          path: ${{ runner.temp }}/anhaenge
          retention-days: 7
          if-no-files-found: ignore
      - name: Drive-Fehler melden
        if: steps.drive.outcome == 'failure'
        run: |
          echo "::error::Anhaenge konnten nicht nach Google Drive; sie liegen 7 Tage im Artefakt."
          exit 1
