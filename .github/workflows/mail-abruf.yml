# Wiederverwendbarer Ablauf: Mails eines Kontos abholen und im aufrufenden
# Daten-Repo ablegen. Zugangsdaten kommen zur Laufzeit aus Bitwarden.
name: Mail-Abruf

on:
  workflow_call:
    inputs:
      konto:
        description: Name der Quelle, z. B. gmx oder gmail
        required: true
        type: string
      host:
        description: IMAP-Server
        required: true
        type: string
      bitwarden_eintrag:
        description: Name des Bitwarden-Eintrags (Benutzername + Passwort)
        required: true
        type: string
      postfach:
        type: string
        default: INBOX
      code:
        description: pip-Quelle des Second-Brain-Codes
        type: string
        default: git+https://github.com/HaraldKiessling/second-brain@main
    secrets:
      BW_CLIENTID:
        required: true
      BW_CLIENTSECRET:
        required: true
      BW_PASSWORD:
        required: true

jobs:
  abruf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "${{ inputs.code }}"
      - run: npm install -g @bitwarden/cli@2026.9.1
      - name: Abrufen
        env:
          BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
          BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}
          BW_PASSWORD: ${{ secrets.BW_PASSWORD }}
          EINTRAG: ${{ inputs.bitwarden_eintrag }}
        run: |
          bw config server https://vault.bitwarden.eu > /dev/null
          bw login --apikey > /dev/null
          export BW_SESSION="$(bw unlock --passwordenv BW_PASSWORD --raw)"
          echo "::add-mask::$BW_SESSION"
          export MAIL_USER="$(bw get username "$EINTRAG")"
          export MAIL_PASSWORD="$(bw get password "$EINTRAG")"
          echo "::add-mask::$MAIL_PASSWORD"
          second-brain mail-abruf . --konto "${{ inputs.konto }}" --host "${{ inputs.host }}" \
            --postfach "${{ inputs.postfach }}" --anhaenge "$RUNNER_TEMP/anhaenge"
          bw lock > /dev/null
      - run: second-brain pruefen .
      - name: Speichern
        run: |
          git config user.name "second-brain"
          git config user.email "second-brain@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "mail: Abruf ${{ inputs.konto }} ($(date -u +%F))"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: anhaenge-${{ inputs.konto }}
          path: ${{ runner.temp }}/anhaenge
          retention-days: 7
          if-no-files-found: ignore
